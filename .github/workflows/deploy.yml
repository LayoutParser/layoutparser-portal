name: Deploy LayoutParser Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layoutparser-web-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Produção HTTPS (React + BFF)
    runs-on: [self-hosted, Linux, layoutparser-portal]
    timeout-minutes: 60
    environment:
      name: production
    env:
      # Valores não secretos do host Linux de produção (Node/PM2/Nginx). Ajuste aqui se mudarem.
      DEPLOY_ROOT: /opt/layoutparser
      SITE_NAME: layoutparser
      SSL_CERT_PATH: /etc/ssl/layoutparser/fullchain.pem
      SSL_CERT_KEY_PATH: /etc/ssl/layoutparser/privkey.pem

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Instalar dependências reproduzíveis
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix server

      # `npm run quality` não executa E2E (Playwright), então não precisa instalar Chromium aqui.
      - name: Quality gates e builds
        shell: bash
        env:
          VITE_API_BASE_URL: ''
        run: |
          set -euo pipefail
          npm run quality
          test -d dist || { echo 'dist/ não foi gerado.'; exit 1; }
          test -d server/dist || { echo 'server/dist/ não foi gerado.'; exit 1; }

      - name: Publicar release e reiniciar o BFF (PM2 + Nginx)
        shell: bash
        env:
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}
          LAYOUTPARSER_API_URL: ${{ vars.LAYOUTPARSER_API_URL }}
          BFF_ADMIN_USERS: ${{ secrets.BFF_ADMIN_USERS }}
          BFF_ADMIN_ROLES: ${{ secrets.BFF_ADMIN_ROLES }}
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BFF_DNS_SERVERS: ${{ vars.BFF_DNS_SERVERS }}
        run: |
          set -euo pipefail
          require() {
            local kind="$1" name="$2"
            if [[ -z "${!name// }" ]]; then
              echo "::error::$kind $name ausente."
              exit 1
            fi
          }
          require Variable PUBLIC_HOST
          require Variable LAYOUTPARSER_API_URL
          require Variable ENTRA_TENANT_ID
          require Variable ENTRA_CLIENT_ID
          require Secret ENTRA_CLIENT_SECRET
          require Variable GOOGLE_CLIENT_ID
          require Secret GOOGLE_CLIENT_SECRET
          if [[ -z "${BFF_ADMIN_USERS// }" && -z "${BFF_ADMIN_ROLES// }" ]]; then
            echo '::error::Configure o secret BFF_ADMIN_USERS e/ou BFF_ADMIN_ROLES.'
            exit 1
          fi

          # Mapeia os nomes do GitHub para o contrato de env do script.
          export UPSTREAM_URL="$LAYOUTPARSER_API_URL"
          export ADMIN_USERS="$BFF_ADMIN_USERS"
          export ADMIN_ROLES="$BFF_ADMIN_ROLES"
          export DNS_SERVERS="$BFF_DNS_SERVERS"
          export FRONTEND_SOURCE=dist
          export SERVER_SOURCE=server

          bash ./scripts/deploy-linux.sh
